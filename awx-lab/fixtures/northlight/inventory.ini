# Northlight Hosting Co-op -- a fictional small hosting co-operative.
# Both "servers" are invented names. In this lab they point at the
# lab machine itself (127.0.0.1) and use a local connection, so the
# playbook talks to the machine it runs on and to nobody else.
# In a real inventory these names would be real hosts reached over
# SSH -- that is the inventory AWX would hold. See the guide text.

[webservers]
northlight-web-01 ansible_host=127.0.0.1 ansible_connection=local
northlight-web-02 ansible_host=127.0.0.1 ansible_connection=local
